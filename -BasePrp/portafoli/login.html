<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Cristhian Ilizarbe</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');

    :root{
        --bg: #05060f;
        --cyan: #00f0ff;
        --magenta: #ff2e9a;
        --violet: #7b2ff7;
        --text: #dff3ff;
        --text-dim: #7d93b8;
    }

    *{ margin:0; padding:0; box-sizing:border-box; }

    body{
        font-family:'Rajdhani', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height:100vh;
        display:flex; align-items:center; justify-content:center;
        padding:1rem;
        overflow-x:hidden;
        position:relative;
    }

    #matrix-bg{ position:fixed; inset:0; z-index:0; opacity:0.3; }

    body::before{
        content:''; position:fixed; inset:0; z-index:0;
        background:
            radial-gradient(ellipse at 15% 20%, rgba(0,240,255,0.14) 0%, transparent 55%),
            radial-gradient(ellipse at 85% 15%, rgba(255,46,154,0.12) 0%, transparent 50%),
            radial-gradient(ellipse at 50% 90%, rgba(123,47,247,0.16) 0%, transparent 55%);
        pointer-events:none;
    }

    .header{
        position:fixed; top:0; left:0; right:0; z-index:100;
        background: rgba(6,4,20,0.75);
        backdrop-filter: blur(14px);
        padding:0.9rem 2rem;
        display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;
        border-bottom:1px solid rgba(0,240,255,0.25);
        box-shadow:0 0 30px rgba(0,240,255,0.12);
    }

    .logo-area{ display:flex; align-items:center; gap:1rem; }
    .logo{ width:44px; height:44px; border-radius:10px; overflow:hidden; border:2px solid var(--cyan); box-shadow:0 0 14px rgba(0,240,255,0.5); }
    .logo img{ width:100%; height:100%; object-fit:cover; }
    .facultad h3{ color:var(--magenta); font-size:0.68rem; letter-spacing:2.5px; font-family:'Orbitron', sans-serif; text-transform:uppercase; }
    .facultad h2{ color:#fff; font-size:1rem; font-family:'Orbitron', sans-serif; text-shadow:0 0 10px rgba(0,240,255,0.6); }

    .nav-menu{ display:flex; gap:0.7rem; }
    .nav-menu a{
        color: var(--cyan); text-decoration:none; font-weight:700;
        padding:0.45rem 1rem; border-radius:4px;
        border:1px solid rgba(0,240,255,0.3);
        font-family:'Orbitron', sans-serif; font-size:0.65rem; letter-spacing:1.5px;
        transition:all 0.3s;
    }
    .nav-menu a:hover{ background:rgba(0,240,255,0.12); border-color:var(--cyan); box-shadow:0 0 16px rgba(0,240,255,0.5); }
    .nav-menu a.active{ color:#05060f; background:var(--cyan); box-shadow:0 0 20px rgba(0,240,255,0.7); }

    .login-card{
        position:relative; z-index:10;
        background: rgba(14,8,32,0.72);
        backdrop-filter:blur(12px);
        padding:2.6rem; border-radius:1rem;
        width:400px; max-width:100%;
        text-align:center; margin-top:90px;
        border:1px solid rgba(0,240,255,0.3);
        box-shadow:0 0 50px rgba(123,47,247,0.2), inset 0 0 40px rgba(0,240,255,0.04);
        overflow:hidden;
    }

    .login-card::before{
        content:''; position:absolute; inset:-2px; border-radius:1rem; z-index:-1;
        background: linear-gradient(60deg, var(--cyan), var(--violet), var(--magenta), var(--cyan));
        background-size:400%;
        animation: borderGlow 6s linear infinite;
        opacity:0.5;
    }
    @keyframes borderGlow{ 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }

    .icon-wrap{ position:relative; width:66px; height:66px; margin:0 auto 1.1rem; }
    .icon-badge{
        width:66px; height:66px;
        border-radius:50%;
        display:flex; align-items:center; justify-content:center;
        background: conic-gradient(from 0deg, var(--cyan), var(--violet), var(--magenta), var(--cyan));
        animation: spin 8s linear infinite;
        box-shadow:0 0 22px rgba(0,240,255,0.4);
    }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    .icon-inner{
        width:56px; height:56px; border-radius:50%;
        background: var(--bg);
        display:flex; align-items:center; justify-content:center;
        position:absolute; top:5px; left:5px;
    }

    .login-card h2{
        font-family:'Orbitron', sans-serif; font-size:1rem; letter-spacing:2px;
        background: linear-gradient(120deg, var(--cyan), var(--violet), var(--magenta));
        -webkit-background-clip:text; background-clip:text; color:transparent;
        margin-bottom:0.5rem;
    }
    .login-card p{ color: var(--text-dim); margin-bottom:1.4rem; font-size:0.9rem; letter-spacing:0.5px; }

    .cyber-line{
        height:1px; margin:0 0 1.4rem;
        background:linear-gradient(90deg, transparent, var(--cyan), var(--violet), var(--magenta), transparent);
        animation:scanline 2.4s linear infinite;
    }
    @keyframes scanline{ 0%{opacity:0.4;} 50%{opacity:1;} 100%{opacity:0.4;} }

    input{
        width:100%; padding:12px 16px; margin:8px 0;
        background: rgba(0,240,255,0.06);
        border:1px solid rgba(0,240,255,0.35);
        border-radius:6px; font-size:1rem; color: var(--text);
        outline:none; transition:0.3s;
        font-family:'Rajdhani', sans-serif; letter-spacing:0.5px;
    }
    input::placeholder{ color: var(--text-dim); }
    input:focus{ border-color: var(--cyan); box-shadow:0 0 14px rgba(0,240,255,0.3); background:rgba(0,240,255,0.1); }

    button{
        background: transparent; color: var(--cyan);
        border:1px solid var(--cyan); padding:12px; width:100%;
        border-radius:6px; font-weight:700; font-size:0.85rem;
        cursor:pointer; margin-top:1.1rem; transition:0.3s;
        font-family:'Orbitron', sans-serif; letter-spacing:2px;
        position:relative; overflow:hidden;
    }
    button::before{
        content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
        background:linear-gradient(90deg, transparent, rgba(0,240,255,0.35), transparent);
        transition:left 0.4s;
    }
    button:hover::before{ left:100%; }
    button:hover:not(:disabled){ background: rgba(0,240,255,0.12); box-shadow:0 0 20px rgba(0,240,255,0.5); }
    button:disabled{ opacity:0.5; cursor:not-allowed; }

    .msg{ margin-top:1rem; font-size:0.85rem; min-height:1.2rem; }
    .msg.error{ color: var(--magenta); text-shadow:0 0 8px rgba(255,46,154,0.5); }
    .msg.success{ color: var(--cyan); text-shadow:0 0 8px rgba(0,240,255,0.5); }

    .config-warning{
        margin-top:1.2rem; padding:0.7rem; border-radius:6px;
        background:rgba(255,46,154,0.08); border:1px solid rgba(255,46,154,0.4);
        color: var(--magenta); font-size:0.72rem; text-align:left; line-height:1.5;
        font-family:'Share Tech Mono', monospace; display:none;
    }

    @media (max-width:480px){
        .header{ flex-direction:column; align-items:flex-start; gap:0.6rem; padding:0.8rem 1rem; }
        .nav-menu{ width:100%; justify-content:space-between; }
        .nav-menu a{ flex:1; text-align:center; padding:0.45rem 0.2rem; font-size:0.58rem; }
        .login-card{ padding:1.8rem 1.4rem; margin-top:140px; }
    }
</style>
</head>
<body>

<canvas id="matrix-bg"></canvas>

<div class="header">
    <div class="logo-area">
        <div class="logo"><img src="imagenes/descarga.png" alt="Logo UPLA"></div>
        <div class="facultad">
            <h3>Facultad de Ingeniería</h3>
            <h2>Sistemas y Computación</h2>
        </div>
    </div>
    <div class="nav-menu">
        <a href="index.html">INICIO</a>
        <a href="trabajos.html">TRABAJOS</a>
        <a href="login.html" class="active">LOGIN</a>
    </div>
</div>

<div class="login-card">
    <div class="icon-wrap">
        <div class="icon-badge"></div>
        <div class="icon-inner">
            <svg viewBox="0 0 24 24" fill="none" width="28" height="28">
                <rect x="5" y="11" width="14" height="9" rx="1.5" stroke="#00f0ff" stroke-width="1.5"/>
                <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="#00f0ff" stroke-width="1.5"/>
                <circle cx="12" cy="15" r="1.4" fill="#ff2e9a"/>
            </svg>
        </div>
    </div>
    <h2>ACCESO ADMINISTRADOR</h2>
    <p>Ingresa para gestionar tus trabajos</p>
    <div class="cyber-line"></div>

    <div id="loginForm">
        <input type="text" id="email" placeholder="▶ USUARIO" autocomplete="username">
        <input type="password" id="password" placeholder="▶ CONTRASEÑA" autocomplete="current-password">
        <button id="loginBtn" onclick="handleLogin()">⬡ INGRESAR AL PANEL</button>
    </div>
    <div id="msg" class="msg"></div>
</div>

<script>
    // ======================================================
    // 🔧 USUARIO Y CONTRASEÑA (login simple)
    // ======================================================
    const USUARIO_VALIDO = "cristhian";
    const PASSWORD_VALIDO = "123456";
    // ======================================================

    // Si ya inició sesión antes, entra directo
    if (localStorage.getItem('adminLogged') === 'true') {
        window.location.href = "admin.html";
    }

    function handleLogin() {
        const msg = document.getElementById('msg');
        const btn = document.getElementById('loginBtn');
        const usuario = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        msg.className = 'msg';
        msg.innerText = '';

        if (!usuario || !password) {
            msg.className = 'msg error';
            msg.innerText = '⚠ Completa usuario y contraseña';
            return;
        }

        btn.disabled = true;
        btn.innerText = '⬡ VERIFICANDO...';

        setTimeout(() => {
            btn.disabled = false;
            btn.innerText = '⬡ INGRESAR AL PANEL';

            if (usuario !== USUARIO_VALIDO || password !== PASSWORD_VALIDO) {
                msg.className = 'msg error';
                msg.innerText = '⚠ Usuario o contraseña incorrectos';
                return;
            }

            localStorage.setItem('adminLogged', 'true');
            msg.className = 'msg success';
            msg.innerText = '✓ Acceso concedido, redirigiendo...';
            setTimeout(() => window.location.href = "admin.html", 500);
        }, 400);
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handleLogin();
    });

    (function(){
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        let w, h, columns, drops;
        const chars = '01アイウエオカキクケコサシスセソ<>[]{}#$%';
        const colors = ['#00f0ff', '#ff2e9a', '#7b2ff7'];

        function setup(){
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            const fontSize = 15;
            columns = Math.floor(w / fontSize);
            drops = new Array(columns).fill(1);
        }
        setup();
        window.addEventListener('resize', setup);

        function draw(){
            ctx.fillStyle = 'rgba(5,6,15,0.08)';
            ctx.fillRect(0, 0, w, h);
            ctx.font = '15px monospace';
            for(let i=0;i<drops.length;i++){
                const text = chars[Math.floor(Math.random()*chars.length)];
                ctx.fillStyle = colors[Math.floor(Math.random()*colors.length)];
                ctx.fillText(text, i*15, drops[i]*15);
                if(drops[i]*15 > h && Math.random() > 0.975){ drops[i] = 0; }
                drops[i]++;
            }
        }
        setInterval(draw, 55);
    })();
</script>
</body>
</html>
